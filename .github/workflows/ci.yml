name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Blocking: the pure business-logic engines must stay green.
      - name: Unit tests
        run: npm run test

      # Blocking: the project currently typechecks clean — keep it that way.
      - name: Typecheck
        run: npm run typecheck

      # Advisory for now (large pre-existing lint surface). Flip to blocking once clean.
      - name: Lint
        run: npm run lint
        continue-on-error: true
