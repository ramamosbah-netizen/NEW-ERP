<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline | JEET ERP</title>
  <style>
    :root {
      --bg: #020617;
      --card: #0f172a;
      --border: #1e293b;
      --mint: #00E5A0;
      --text: #f8fafc;
      --text-muted: #64748b;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
    }
    .container {
      background-color: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 40px;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }
    .icon {
      font-size: 48px;
      color: var(--mint);
      margin-bottom: 20px;
    }
    h1 {
      font-size: 20px;
      margin: 0 0 10px 0;
      font-weight: 700;
      letter-spacing: -0.025em;
    }
    p {
      color: var(--text-muted);
      font-size: 13px;
      line-height: 1.5;
      margin: 0 0 24px 0;
    }
    .btn {
      background-color: var(--mint);
      color: #020617;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .btn:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">⚡</div>
    <h1>Connection Lost</h1>
    <p>You are currently offline. JEET ERP has queued write operations locally in IndexedDB, which will automatically sync once your connection is restored.</p>
    <button class="btn" onclick="window.location.reload()">Retry Connection</button>
  </div>
</body>
</html>
